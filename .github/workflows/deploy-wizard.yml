name: Deploy Wizard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wizard/**'
      - '.github/workflows/deploy-wizard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wizard/package-lock.json

      - name: Install dependencies
        working-directory: wizard
        run: npm ci

      - name: Remove API routes (server-only, not compatible with static export)
        run: rm -rf wizard/app/api

      - name: Build static export
        working-directory: wizard
        env:
          NEXT_STATIC_EXPORT: 'true'
        run: npm run build

      - name: Add .nojekyll
        run: touch wizard/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wizard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
